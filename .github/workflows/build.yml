name: Build MGD Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ cmake ninja-build libvulkan-dev vulkan-tools

      - name: Install Catch2 v3
        run: |
          git clone --depth 1 --branch v3.5.3 https://github.com/catchorg/Catch2.git /tmp/Catch2
          cmake -S /tmp/Catch2 -B /tmp/Catch2-build -G Ninja \
            -DCATCH_BUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/Catch2-build --parallel 2
          sudo cmake --install /tmp/Catch2-build
          sudo ldconfig

      - name: Build (C++ core)
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Run tests (optional)
        run: ./build/mgd_tests || echo "Tests skipped/failed, continuing..."

      - name: Run polygon benchmark (optional)
        run: |
          g++ -std=c++17 -Wall -Wextra -I. -I./core -I./emulador-mgd \
            $(find core emulador-mgd -name '*.cpp' | tr '\n' ' ') \
            tools/benchmark_polygon.cpp -o build/benchmark_polygon 2>/dev/null && \
            ./build/benchmark_polygon || echo "Benchmark skipped, continuing..."

      - name: Run headless demo (optional)
        run: ./build/mgd_app || echo "Demo skipped, continuing..."

      - name: Upload headless demo + PPM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mgd-headless-linux
          path: |
            build/mgd_app
            build/mgd_tests
            output.ppm

  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-vulkan-headers
            mingw-w64-x86_64-vulkan-loader

      - name: Build EXE (MGDobra-prima)
        shell: msys2 {0}
        run: |
          g++ --version
          mkdir -p build
          CORE_SOURCES=$(find core emulador-mgd -name '*.cpp' | sort | tr '\n' ' ')
          TEST_SOURCES=$(find tests -name '*.cpp' | sort | tr '\n' ' ')
          g++ -std=c++17 -Wall -Wextra -I. -I./core -I./emulador-mgd \
            -DMGD_TESTING $CORE_SOURCES $TEST_SOURCES -o build/mgd_tests.exe
          g++ -std=c++17 -Wall -Wextra -I. -I./core -I./emulador-mgd \
            $CORE_SOURCES emulador-mgd/runtime/MarioOdysseyRunner.cpp -o build/mgd_app.exe
          g++ -std=c++17 -Wall -Wextra -I. -I./core -I./emulador-mgd \
            $CORE_SOURCES emulador-mgd/runtime/MarioOdysseyRunner.cpp \
            -o build/mgd_launcher.exe || echo "launcher build skipped (no SDL2)"
          ls -lh build/

      - name: Run tests (Windows)
        shell: msys2 {0}
        run: ./build/mgd_tests.exe

      - name: Run headless demo (Windows)
        shell: msys2 {0}
        run: ./build/mgd_app.exe

      - name: Upload EXE + Launcher UI
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mgd-exe-windows
          path: |
            build/mgd_tests.exe
            build/mgd_app.exe
            build/mgd_launcher.exe
            interface/launcher/
            output.ppm

  build-android:
    runs-on: ubuntu-latest

    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Android SDK + NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Set up signing keystore
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > android/mgd-release-key.keystore
            chmod 600 android/mgd-release-key.keystore
          fi

- name: Build Android Release APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          cd android
          chmod +x gradlew
          cat > keystore.properties <<EOF
          storeFile=mgd-release-key.keystore
          storePassword=${SIGNING_STORE_PASSWORD}
          keyAlias=${SIGNING_KEY_ALIAS}
          keyPassword=${SIGNING_KEY_PASSWORD}
          EOF
          # Use gradle wrapper with explicit java and proper classpath
          bash ./gradlew assembleRelease --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx4g"

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mgd-apk-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          tag_name: mgd-release-${{ github.run_number }}
          name: "MGD Release - Run #${{ github.run_number }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}