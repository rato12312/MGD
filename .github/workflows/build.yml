name: Build MGD Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Run tests
        run: ./build/mgd_tests

      - name: Run polygon benchmark
        run: |
          g++ -std=c++17 -Wall -Wextra -I. $(find core -name '*.cpp' | tr '\n' ' ') tools/benchmark_polygon.cpp -o build/benchmark_polygon
          ./build/benchmark_polygon

      - name: Run headless demo
        run: ./build/mgd_app

      - name: Upload headless demo + PPM
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mgd-headless-linux
          path: |
            build/mgd_app
            build/mgd_tests
            output.ppm

  build-windows-exe:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build EXE (MGD obra-prima)
        shell: msys2 {0}
        run: |
          g++ --version
          mkdir -p build
          CORE_SOURCES=$(find core -name '*.cpp' | sort | tr '\n' ' ')
          TEST_SOURCES=$(find tests -name '*.cpp' | sort | tr '\n' ' ')
          g++ -std=c++17 -Wall -Wextra -I. -DMGD_TESTING $CORE_SOURCES $TEST_SOURCES -o build/mgd_tests.exe
          g++ -std=c++17 -Wall -Wextra -I. $CORE_SOURCES src/main.cpp -o build/mgd_app.exe
          g++ -std=c++17 -Wall -Wextra -I. $CORE_SOURCES src/mgd_launcher.cpp -o build/mgd_launcher.exe || echo "launcher build skipped (no SDL2)"
          ls -lh build/

      - name: Run tests (Windows)
        shell: msys2 {0}
        run: ./build/mgd_tests.exe

      - name: Run headless demo (Windows)
        shell: msys2 {0}
        run: ./build/mgd_app.exe

      - name: Upload EXE + Launcher UI
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mgd-exe-windows
          path: |
            build/mgd_tests.exe
            build/mgd_app.exe
            build/mgd_launcher.exe
            interface/launcher/
            output.ppm

  build-android:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Android SDK + NDK
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jdk wget unzip
          ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV
          
      - name: Build Android APK
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g"
          
      - name: Upload Android APK
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mgd-apk-android
          path: android/app/build/outputs/apk/debug/app-debug.apk