name: Build MGD Engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libsdl2-dev

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release

      - name: Build core library
        run: cmake --build build --config Release -- -j$(nproc)

      - name: Build tests
        run: cmake --build build --config Release --target mgd_tests -- -j$(nproc)

      - name: Run tests
        run: |
          cd build
          ./mgd_tests || true
