name: Release MGD EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc

      - name: Build EXE
        shell: msys2 {0}
        run: |
          mkdir -p build
          CORE_SOURCES=$(find core -name '*.cpp' | sort | tr '\n' ' ')
          TEST_SOURCES=$(find tests -name '*.cpp' | sort | tr '\n' ' ')
          g++ -std=c++17 -Wall -Wextra -I. -DMGD_TESTING $CORE_SOURCES $TEST_SOURCES -o build/mgd_tests.exe
          g++ -std=c++17 -Wall -Wextra -I. $CORE_SOURCES src/main.cpp -o build/mgd_app.exe
          g++ -std=c++17 -Wall -Wextra -I. $CORE_SOURCES src/mgd_launcher.cpp -o build/mgd_launcher.exe
          ls -lh build/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/mgd_tests.exe
            build/mgd_app.exe
            build/mgd_launcher.exe
            output.ppm
          generate_release_notes: true
